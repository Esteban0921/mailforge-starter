# Puertos de host desplazados (+1 en el último dígito de cada uno) porque
# esta máquina ya corre otro stack Docker ("crm") en los puertos por defecto
# de Postgres/Redis/Mailpit. Los puertos *dentro* de cada contenedor son los
# estándar; solo cambia el lado publicado. Ver DATABASE_URL/REDIS_URL/SMTP_*
# en .env.example, que deben coincidir con estos.
services:
  postgres:
    image: postgres:16-alpine
    container_name: mailforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailforge
      POSTGRES_PASSWORD: mailforge
      POSTGRES_DB: mailforge
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mailforge -d mailforge']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mailforge-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailforge-mailpit
    restart: unless-stopped
    ports:
      - '8026:8025' # Interfaz web
      - '1026:1025' # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
  redis_data:
